name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости сборки insights
        run: python -m pip install --quiet -r requirements.txt

      - name: public/ соответствует content/articles
        run: |
          python scripts/build-insights.py
          if ! git diff --quiet -- public; then
            echo "::error title=Сборка устарела::Запустите python scripts/build-insights.py и закоммитьте изменения в public/"
            git diff --stat -- public
            exit 1
          fi

      - name: Тесты обработчика заявок
        run: node scripts/check-lead.mjs

      - name: Тесты /studio (пароль, сессия, маршруты)
        run: node scripts/check-studio.mjs

      - name: Тесты импорта статьи из файла
        run: node scripts/check-import.mjs

      - name: Тесты /demo (лимиты, статусы, контакты)
        run: node scripts/check-audit.mjs

      - name: Тесты CRM (схема D1, лиды, сделки)
        run: node scripts/check-crm.mjs

      - name: Ссылки, формы, canonical/OG/sitemap
        run: python scripts/check-links.py

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверить наличие токена
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Деплой пропущен::Задайте секреты CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)"
          fi

      # Ставим wrangler явно: версия из wrangler-action не читает wrangler.jsonc
      - name: Установить wrangler
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm install --no-save --no-fund --no-audit wrangler@4

      - name: Деплой Worker'а
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
