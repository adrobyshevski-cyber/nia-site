<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#0b0b12" name="theme-color"/><meta content="noindex, nofollow" name="robots"/><title>NIA Studio — редакция Insights</title><link href="/studio/studio.css" rel="stylesheet"/></head><body class="app"><header class="app-head"><span class="mark">NIA</span><span class="where">/ studio · insights</span><span class="state" id="state"></span><span class="spacer"></span><a class="btn" href="/insights/">Insights на сайте ↗</a><button class="btn" id="logout" type="button">Выйти</button></header><div class="layout"><aside class="side"><div class="side-top"><button class="btn primary" id="new" type="button">+ Новая</button><button class="btn" id="reload" type="button">Обновить</button></div><div class="side-filters"><button class="active" data-filter="all" type="button">Все</button><button data-filter="draft" type="button">Черновики</button><button data-filter="live" type="button">Опубликованные</button></div><ul class="side-list" id="list"></ul></aside><main class="editor"><div class="ed-grid"><div class="field wide"><label for="title">Заголовок</label><input id="title" maxlength="120" placeholder="Narrative Strategy: как связать смыслы с решениями"/></div><div class="field"><label for="slug">Slug</label><input id="slug" placeholder="narrative-strategy"/><span class="hint" id="slug-hint">латиница, цифры, дефисы — станет адресом /insights/&lt;slug&gt;/</span></div><div class="field"><label for="date">Дата</label><input id="date" type="date"/></div><div class="field wide"><label for="description">Описание для карточки и поиска</label><textarea id="description" maxlength="300" placeholder="Одно-два предложения: о чём статья и зачем её читать"></textarea><span class="hint" id="desc-hint">до 300 символов</span></div><div class="field wide"><label for="lead">Лид (первый экран)</label><textarea id="lead" placeholder="Вводный абзац, который видит читатель до статьи"></textarea></div><div class="field"><label for="category">Категория</label><input id="category" placeholder="Narrative Economics"/></div><div class="field"><label for="category_ru">Подпись на карточке</label><input id="category_ru" placeholder="Диагностика"/></div><div class="field"><label for="author">Автор</label><input id="author" placeholder="NIA Editorial"/></div><div class="field"><label for="practice">Практика (ссылка)</label><select id="practice"><option value="/audit/">/audit/ — Narrative Audit</option><option value="/brand/">/brand/ — Dissolved Brand</option><option value="/practices/culture.html">/practices/culture.html — Narrative Culture</option><option value="/practices/economics.html">/practices/economics.html — Narrative Economics</option><option value="/practices/strategy.html">/practices/strategy.html — Narrative Strategy</option><option value="/practices/lab.html">/practices/lab.html — NIA Lab</option></select></div><div class="field"><label for="practice_label">Подпись кнопки практики</label><input id="practice_label" placeholder="Narrative Strategy"/></div><div class="field"><label>Флаги</label><div class="check"><input id="featured" type="checkbox"/><label for="featured" style="text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--text);font-weight:400">Показывать в «Начать с главного»</label></div><div class="check"><input id="draft" type="checkbox"/><label for="draft" style="text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--text);font-weight:400">Черновик (не публикуется)</label></div></div></div><div class="split" style="margin-top:18px"><div class="field body"><label for="body">Текст статьи (Markdown)</label><textarea id="body" placeholder="Первый абзац.&#10;&#10;## Подзаголовок&#10;&#10;Текст, **жирный**, *курсив*, [ссылка](https://example.com).&#10;&#10;* пункт списка;&#10;* второй пункт;&#10;&#10;> Цитата."></textarea></div><div class="field"><label>Предпросмотр</label><div class="preview" id="preview"></div></div></div><div class="actions"><button class="btn primary" id="save" type="button">Сохранить черновик</button><button class="btn" id="publish" type="button">Опубликовать</button><a class="link" href="/insights/" id="viewLink" rel="noopener" target="_blank">Открыть на сайте ↗</a><span class="spacer"></span><button class="btn danger" id="remove" type="button">Удалить</button></div></main></div><script src="/studio/studio.js"></script></body></html>
