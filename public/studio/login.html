<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#0b0b12" name="theme-color"/><meta content="noindex, nofollow" name="robots"/><title>Вход — NIA Studio</title><link href="/studio/studio.css" rel="stylesheet"/></head><body class="gate"><main class="gate-box"><div class="eyebrow">[ NIA ] / STUDIO</div><h1>Редакция Insights</h1><p class="gate-hint">Доступ по паролю. Сессия живёт 12 часов, хранится в подписанной cookie.</p><form class="gate-form" id="login-form" novalidate=""><label for="password">Пароль</label><input autocomplete="current-password" autofocus="" id="password" name="password" placeholder="••••-••••-••••-••••-••••" type="password"/><button class="btn primary" type="submit">Войти</button><p aria-live="polite" class="gate-status" id="status" role="status"></p></form><a class="gate-back" href="/">← на сайт</a></main><script>
document.getElementById('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const status = document.getElementById('status');
  const button = event.target.querySelector('button');
  const password = document.getElementById('password').value;
  if (!password) { status.textContent = 'Введите пароль.'; return; }
  button.disabled = true;
  status.textContent = 'Проверяем…';
  try {
    const res = await fetch('/studio/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password }) });
    const data = await res.json().catch(() => ({ ok: false, error: 'Нет ответа от сервера' }));
    if (data.ok) { location.href = '/studio/'; return; }
    status.textContent = data.error || 'Не удалось войти.';
  } catch (error) {
    status.textContent = 'Сеть недоступна: ' + error.message;
  }
  button.disabled = false;
});
</script></body></html>
